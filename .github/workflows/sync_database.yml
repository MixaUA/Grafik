name: Scrape New Energy Schedule

on:
  schedule:
    - cron: '*/15 * * * *' # Кожні 15 хвилин
  workflow_dispatch: # Можливість запустити вручну

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudscraper

      - name: Run Scraper
        run: python scripts/scraper.py

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: автоматичне оновлення графіка (v2)"
          file_pattern: "database_v2.json"
