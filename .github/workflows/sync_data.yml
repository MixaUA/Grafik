name: Sync & Build Database

on:
  repository_dispatch:
    types: [run-sync]
  workflow_dispatch:

concurrency:
  group: scheduler-data-sync
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-generativeai requests beautifulsoup4

      - name: Run AI Processor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_processor.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(data): автоматичне оновлення графіка через AI"
          file_pattern: "database.json"
