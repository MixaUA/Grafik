name: AI Sync Process

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Оновлюємо бібліотеки до актуальних версій 2026 року
      - name: Install dependencies
        run: |
          pip install --upgrade google-generativeai requests beautifulsoup4

      - name: Run AI Processor
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_processor.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: оновлення графіка (Gemini 2.5 Flash)"
          file_pattern: "database_new.json"
